name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, json
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction

      - name: PHP syntax check
        run: |
          find src bin tests -type f \( -name '*.php' -o -name 'mysql-tuner' \) -print0 \
            | xargs -0 -n1 -P4 php -l

      # A baseline may need generating (phpstan analyse --generate-baseline) if
      # this step starts failing against pre-existing issues in src/.
      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --error-format=github

  tests:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # No prefer-lowest leg: the only dependencies are PHPUnit and PHPStan,
        # both dev-only, so resolving them lower proves nothing about the library.
        php: ['8.2', '8.3', '8.4']
        # `os` must be a real matrix key. If it only appeared under `include`,
        # that entry would merge into the existing 8.3 combination and move it to
        # Windows rather than adding a leg, silently losing Ubuntu 8.3 coverage.
        os: [ubuntu-latest]
        include:
          - php: '8.3'
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_mysql, json
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction

      - name: Run tests
        run: vendor/bin/phpunit --no-coverage --fail-on-warning --fail-on-deprecation --fail-on-notice --fail-on-risky

  package-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout package
        uses: actions/checkout@v4
        with:
          path: package

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, json
          tools: composer:v2

      - name: Build consumer project
        run: |
          mkdir -p consumer
          cat > consumer/composer.json <<'EOF'
          {
              "name": "nathanpixodeo/mysql-tuner-consumer-smoke",
              "type": "project",
              "repositories": [
                  {
                      "type": "path",
                      "url": "../package",
                      "options": { "symlink": false }
                  }
              ],
              "require": {
                  "nathanpixodeo/mysql-tuner": "*"
              },
              "minimum-stability": "dev",
              "prefer-stable": true
          }
          EOF

      - name: Install consumer dependencies
        working-directory: consumer
        run: composer install --no-interaction

      - name: Assert binary is installed and executable
        working-directory: consumer
        run: test -x vendor/bin/mysql-tuner

      - name: Assert --version works
        working-directory: consumer
        run: ./vendor/bin/mysql-tuner --version | grep -q 'MySQL Tuner v'

      - name: Assert --help mentions --rules
        working-directory: consumer
        run: ./vendor/bin/mysql-tuner --help | grep -q -- '--rules'

      - name: Assert unreachable server fails cleanly
        working-directory: consumer
        run: |
          set +e
          ./vendor/bin/mysql-tuner -h 127.0.0.1 -P 1 2> err.txt
          code=$?
          set -e
          cat err.txt
          test "$code" -eq 3
          ! grep -qi 'Fatal error' err.txt
